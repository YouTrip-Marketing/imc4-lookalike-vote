# Supabase project settings for the vote API. NOT DEPLOYED: see README.
#
# The function is a public API: voters are anonymous and carry no Supabase login,
# so the platform's own login check is switched off for it. Access is controlled
# inside the function instead (allowed origins, rate limits, admin passcode).
#
# index.js is generated by `npm run build:edge`. Run that before deploying.

[functions.vote-api]
verify_jwt = false
entrypoint = "./functions/vote-api/index.js"
